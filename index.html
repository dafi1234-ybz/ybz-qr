<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>תוכן QR</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: min(92%, 720px);
      background: #fff;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      text-align: center;
    }

    .id {
      font-size: 14px;
      color: #666;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 22px;
      font-size: 30px;
    }

    .btn {
      display: block;
      padding: 15px 20px;
      margin-top: 18px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      background: #2868ae;
      color: white;
    }

    .secondary {
      background: #444;
    }

    .hidden {
      display: none;
    }

    .media-image {
      display: block;
      max-width: 100%;
      max-height: 650px;
      margin: 0 auto;
      border-radius: 12px;
    }

    video {
      width: 100%;
      max-height: 650px;
      background: #000;
      border-radius: 12px;
    }

    iframe {
      width: 100%;
      height: 520px;
      border: 0;
      border-radius: 12px;
    }

    .text-content {
      text-align: right;
      white-space: pre-wrap;
      font-size: 19px;
      line-height: 1.8;
    }

    .message {
      font-size: 18px;
      line-height: 1.6;
      margin: 20px 0;
    }
  </style>
</head>

<body>

<main class="card">

  <div id="qrId" class="id"></div>

  <h1 id="title">טוען תוכן...</h1>

  <div id="contentArea"></div>

  <a
    id="mainBtn"
    class="btn hidden"
    target="_blank"
    rel="noopener">
    פתיחת התוכן
  </a>

  <a
    id="marketingBtn"
    class="btn secondary hidden"
    target="_blank"
    rel="noopener">
    מידע נוסף
  </a>

</main>

<script>

function cleanType(value) {
  return String(value || "")
    .replace(/[,\u060C]/g, "")
    .trim();
}


function getDriveFileId(url) {

  if (!url) return null;

  const text = String(url);

  const match1 = text.match(/\/file\/d\/([^/]+)/);

  if (match1) {
    return match1[1];
  }

  try {

    const u = new URL(text);

    const id = u.searchParams.get("id");

    if (id) {
      return id;
    }

  }
  catch (e) {}

  return null;
}


function getYouTubeId(url) {

  if (!url) return null;

  try {

    if (url.includes("youtu.be/")) {

      return url
        .split("youtu.be/")[1]
        .split("?")[0];

    }

    const u = new URL(url);

    if (u.hostname.includes("youtube.com")) {

      return u.searchParams.get("v");

    }

  }
  catch (e) {}

  return null;
}


async function loadContent() {

  const params =
    new URLSearchParams(window.location.search);

  const id =
    (params.get("id") || "QR01")
      .trim()
      .toUpperCase();

  const qrId =
    document.getElementById("qrId");

  const title =
    document.getElementById("title");

  const contentArea =
    document.getElementById("contentArea");

  const mainBtn =
    document.getElementById("mainBtn");

  const marketingBtn =
    document.getElementById("marketingBtn");


  qrId.textContent = id;


  try {

    const dataUrl =
      new URL("./qr-data.json", window.location.href);

    dataUrl.searchParams.set(
      "nocache",
      Date.now()
    );


    const response =
      await fetch(dataUrl.toString(), {
        cache: "no-store"
      });


    if (!response.ok) {

      throw new Error(
        "qr-data.json HTTP " +
        response.status
      );

    }


    const items =
      await response.json();


    if (!Array.isArray(items)) {

      throw new Error(
        "qr-data.json is not an array"
      );

    }


    const item =
      items.find(
        x =>
          String(x.id || "")
            .trim()
            .toUpperCase() === id
      );


    if (!item) {

      title.textContent =
        "קוד QR לא נמצא";

      contentArea.innerHTML =
        '<div class="message">' +
        'לא נמצא תוכן עבור קוד זה.' +
        '</div>';

      return;

    }


    if (item.active === false) {

      title.textContent =
        "התוכן אינו פעיל";

      contentArea.innerHTML =
        '<div class="message">' +
        'תוכן זה אינו זמין כרגע.' +
        '</div>';

      return;

    }


    title.textContent =
      item.title || id;


    const type =
      cleanType(item.type);

    const url =
      String(item.url || "").trim();


    /*
      אתר
    */
    if (type === "אתר") {

      if (!url) {

        contentArea.innerHTML =
          '<div class="message">' +
          'לא הוגדר קישור.' +
          '</div>';

      }
      else {

        mainBtn.href = url;

        mainBtn.textContent =
          "פתיחת התוכן";

        mainBtn.classList.remove(
          "hidden"
        );

      }

    }


    /*
      תמונה
    */
    else if (type === "תמונה") {

      if (!url) {

        contentArea.innerHTML =
          '<div class="message">' +
          'לא הוגדרה תמונה.' +
          '</div>';

      }
      else {

        let imageUrl = url;


        /*
          אם התמונה נמצאת ב-Google Drive
        */
        if (
          url.includes("drive.google.com")
        ) {

          const driveId =
            getDriveFileId(url);

          if (driveId) {

            imageUrl =
              "https://drive.google.com/thumbnail?id=" +
              encodeURIComponent(driveId) +
              "&sz=w1600";

          }

        }


        const img =
          document.createElement("img");

        img.className =
          "media-image";

        img.src =
          imageUrl;

        img.alt =
          item.title || "תמונה";


        img.onerror =
          function () {

            contentArea.innerHTML =
              '<div class="message">' +
              'לא ניתן לטעון את התמונה.' +
              '</div>';

          };


        contentArea.appendChild(img);

      }

    }


    /*
      PDF
    */
    else if (type === "PDF") {

      if (!url) {

        contentArea.innerHTML =
          '<div class="message">' +
          'לא הוגדר קובץ PDF.' +
          '</div>';

      }
      else {

        const iframe =
          document.createElement(
            "iframe"
          );

        iframe.src = url;

        contentArea.appendChild(
          iframe
        );


        mainBtn.href = url;

        mainBtn.textContent =
          "פתיחת PDF";

        mainBtn.classList.remove(
          "hidden"
        );

      }

    }


    /*
      סרטון
    */
    else if (type === "סרטון") {

      if (!url) {

        contentArea.innerHTML =
          '<div class="message">' +
          'לא הוגדר סרטון.' +
          '</div>';

      }


      /*
        YouTube
      */
      else if (
        url.includes("youtube.com") ||
        url.includes("youtu.be")
      ) {

        const videoId =
          getYouTubeId(url);


        if (!videoId) {

          contentArea.innerHTML =
            '<div class="message">' +
            'קישור YouTube אינו תקין.' +
            '</div>';

        }
        else {

          const iframe =
            document.createElement(
              "iframe"
            );

          iframe.src =
            "https://www.youtube.com/embed/" +
            encodeURIComponent(videoId);

          iframe.allow =
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";

          iframe.allowFullscreen =
            true;

          contentArea.appendChild(
            iframe
          );

        }

      }


      /*
        Google Drive
      */
      else if (
        url.includes("drive.google.com")
      ) {

        const driveId =
          getDriveFileId(url);


        if (!driveId) {

          contentArea.innerHTML =
            '<div class="message">' +
            'קישור Google Drive אינו תקין.' +
            '</div>';

        }
        else {

          const iframe =
            document.createElement(
              "iframe"
            );

          iframe.src =
            "https://drive.google.com/file/d/" +
            encodeURIComponent(driveId) +
            "/preview";

          iframe.allow =
            "autoplay; fullscreen";

          iframe.allowFullscreen =
            true;

          contentArea.appendChild(
            iframe
          );

        }

      }


      /*
        MP4 / סרטון ישיר
      */
      else {

        const video =
          document.createElement(
            "video"
          );

        video.src = url;

        video.controls = true;

        video.playsInline = true;

        video.preload = "metadata";


        video.onerror =
          function () {

            contentArea.innerHTML =
              '<div class="message">' +
              'לא ניתן לנגן את הסרטון.' +
              '</div>';

          };


        contentArea.appendChild(
          video
        );

      }

    }


    /*
      טקסט
    */
    else if (type === "טקסט") {

      const div =
        document.createElement("div");

      div.className =
        "text-content";

      div.textContent =
        item.textContent || "";

      contentArea.appendChild(div);

    }


    /*
      סוג לא מוכר
    */
    else {

      contentArea.innerHTML =
        '<div class="message">' +
        'סוג תוכן לא נתמך: ' +
        type +
        '</div>';

    }


    /*
      מידע נוסף
    */
    if (
      item.showMarketing === true &&
      item.marketingUrl
    ) {

      marketingBtn.href =
        item.marketingUrl;

      marketingBtn.textContent =
        item.marketingText ||
        "מידע נוסף";

      marketingBtn.classList.remove(
        "hidden"
      );

    }

  }


  catch (error) {

    console.error(
      "QR error:",
      error
    );

    title.textContent =
      "שגיאה בטעינת התוכן";

    contentArea.innerHTML =
      '<div class="message">' +
      'נסה שוב בעוד מספר שניות.' +
      '</div>';

  }

}


loadContent();

</script>

</body>
</html>
