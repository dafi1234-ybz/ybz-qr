<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>תוכן QR</title>

  <style>
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#f4f6f8;
      color:#222;
      display:flex;
      min-height:100vh;
      align-items:center;
      justify-content:center;
    }

    .card{
      width:min(92%,700px);
      background:#fff;
      padding:28px;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      text-align:center;
    }

    h1{margin-top:0}
    .id{font-size:14px;color:#666;margin-bottom:15px}

    .btn{
      display:block;
      text-decoration:none;
      padding:15px 20px;
      margin:14px 0;
      border-radius:12px;
      font-size:20px;
      font-weight:700;
      background:#1f5fa8;
      color:#fff;
    }

    .secondary{background:#444}
    .hidden{display:none}

    img.media{
      max-width:100%;
      height:auto;
      border-radius:12px;
      margin-top:15px;
    }

    video{
      width:100%;
      max-height:500px;
      border-radius:12px;
      margin-top:15px;
    }

    iframe{
      width:100%;
      height:500px;
      border:0;
      border-radius:12px;
      margin-top:15px;
    }

    .text-content{
      text-align:right;
      white-space:pre-wrap;
      font-size:18px;
      line-height:1.7;
      margin-top:20px;
    }
  </style>
</head>

<body>

<main class="card">
  <div id="qrId" class="id"></div>

  <h1 id="title">טוען תוכן...</h1>

  <div id="contentArea"></div>

  <a id="mainBtn"
     class="btn hidden"
     href="#"
     target="_blank"
     rel="noopener">
     פתיחת התוכן
  </a>

  <a id="marketingBtn"
     class="btn secondary hidden"
     href="#"
     target="_blank"
     rel="noopener">
     מידע נוסף
  </a>
</main>

<script>
async function loadContent() {

  const params = new URLSearchParams(window.location.search);
  const id = (params.get("id") || "QR01").toUpperCase();

  const qrId = document.getElementById("qrId");
  const title = document.getElementById("title");
  const contentArea = document.getElementById("contentArea");
  const mainBtn = document.getElementById("mainBtn");
  const marketingBtn = document.getElementById("marketingBtn");

  qrId.textContent = id;

  try {
    const response = await fetch(
      "qr-data.json?time=" + new Date().getTime()
    );

    const items = await response.json();

    const item = items.find(
      x => x.id === id && x.active === true
    );

    if (!item) {
      title.textContent = "קוד QR לא נמצא";
      contentArea.textContent = "לא נמצא תוכן פעיל עבור קוד זה.";
      return;
    }

    title.textContent = item.title || id;

    const type = (item.type || "").trim();

    if (type === "אתר") {
      mainBtn.href = item.url;
      mainBtn.classList.remove("hidden");
    }

    else if (type === "תמונה") {
      const img = document.createElement("img");
      img.src = item.url;
      img.className = "media";
      img.alt = item.title || "";
      contentArea.appendChild(img);
    }

    else if (type === "PDF") {
      const iframe = document.createElement("iframe");
      iframe.src = item.url;
      contentArea.appendChild(iframe);

      mainBtn.href = item.url;
      mainBtn.textContent = "פתיחת PDF";
      mainBtn.classList.remove("hidden");
    }

    else if (type === "סרטון") {

      if (
        item.url.includes("youtube.com") ||
        item.url.includes("youtu.be")
      ) {
        let videoId = "";

        if (item.url.includes("youtu.be/")) {
          videoId = item.url.split("youtu.be/")[1].split("?")[0];
        }
        else {
          const u = new URL(item.url);
          videoId = u.searchParams.get("v");
        }

        const iframe = document.createElement("iframe");
        iframe.src = "https://www.youtube.com/embed/" + videoId;
        iframe.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
        iframe.allowFullscreen = true;

        contentArea.appendChild(iframe);
      }
      else {
        const video = document.createElement("video");
        video.src = item.url;
        video.controls = true;
        contentArea.appendChild(video);
      }
    }

    else if (type === "טקסט") {
      const div = document.createElement("div");
      div.className = "text-content";
      div.textContent = item.textContent || "";
      contentArea.appendChild(div);
    }

    else {
      contentArea.textContent = "סוג תוכן לא נתמך.";
    }

    if (
      item.showMarketing === true &&
      item.marketingUrl
    ) {
      marketingBtn.textContent =
        item.marketingText || "מידע נוסף";

      marketingBtn.href = item.marketingUrl;

      marketingBtn.classList.remove("hidden");
    }

  }
  catch(error) {
    title.textContent = "שגיאה בטעינת התוכן";
    contentArea.textContent = "נסה שוב בעוד מספר שניות.";
  }
}

loadContent();
</script>

</body>
</html>
