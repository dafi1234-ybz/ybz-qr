<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תוכן QR</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#222;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{width:min(92%,520px);background:#fff;padding:32px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
h1{margin-top:0;font-size:30px}
p{font-size:18px;line-height:1.6}
.id{font-size:14px;color:#666;margin-bottom:18px}
.btn{display:block;text-decoration:none;padding:16px 20px;margin:14px 0;border-radius:12px;font-size:20px;font-weight:700;background:#1f5fa8;color:#fff}
.secondary{background:#444}
.hidden{display:none}
</style>
</head>
<body>
<main class="card">
<div id="qrId" class="id"></div>
<h1 id="title">תוכן QR</h1>
<p id="description">לחצו על הכפתור לצפייה בתוכן.</p>
<a id="mainBtn" class="btn" href="#" target="_blank" rel="noopener">פתיחת התוכן</a>
<a id="marketingBtn" class="btn secondary" href="#" target="_blank" rel="noopener">מידע נוסף</a>
</main>
<script>
const items = {};
for (let i=1;i<=10;i++){
  const id = "QR" + String(i).padStart(2,"0");
  items[id] = {
    title: i===1 ? "תוכן ראשי" : "תוכן " + id,
    url: "https://www.ybz.org.il",
    marketingText: "מידע נוסף",
    marketingUrl: "https://www.ybz.org.il",
    showMarketing: true
  };
}
const params = new URLSearchParams(window.location.search);
const id = (params.get("id") || "QR01").toUpperCase();
const item = items[id];
const qrId = document.getElementById("qrId");
const title = document.getElementById("title");
const description = document.getElementById("description");
const mainBtn = document.getElementById("mainBtn");
const marketingBtn = document.getElementById("marketingBtn");

if (!item){
  qrId.textContent = id;
  title.textContent = "קוד QR לא נמצא";
  description.textContent = "המזהה שבכתובת אינו מוגדר במערכת.";
  mainBtn.classList.add("hidden");
  marketingBtn.classList.add("hidden");
}else{
  qrId.textContent = id;
  title.textContent = item.title;
  mainBtn.href = item.url;
  marketingBtn.textContent = item.marketingText;
  marketingBtn.href = item.marketingUrl;
  if (!item.showMarketing) marketingBtn.classList.add("hidden");
}
</script>
</body>
</html>
