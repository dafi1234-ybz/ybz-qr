<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>תוכן QR</title>

  <style>
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#f4f6f8;
      color:#222;
      display:flex;
      min-height:100vh;
      align-items:center;
      justify-content:center;
    }

    .card{
      width:min(92%,520px);
      background:#fff;
      padding:32px;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      text-align:center;
    }

    h1{
      margin-top:0;
      font-size:30px;
    }

    p{
      font-size:18px;
      line-height:1.6;
    }

    .id{
      font-size:14px;
      color:#666;
      margin-bottom:18px;
    }

    .btn{
      display:block;
      text-decoration:none;
      padding:16px 20px;
      margin:14px 0;
      border-radius:12px;
      font-size:20px;
      font-weight:700;
      background:#1f5fa8;
      color:#fff;
    }

    .secondary{
      background:#444;
    }

    .hidden{
      display:none;
    }
  </style>
</head>

<body>

<main class="card">
  <div id="qrId" class="id"></div>

  <h1 id="title">טוען תוכן...</h1>

  <p id="description">
    אנא המתן
  </p>

  <a id="mainBtn"
     class="btn hidden"
     href="#"
     target="_blank"
     rel="noopener">
     פתיחת התוכן
  </a>

  <a id="marketingBtn"
     class="btn secondary hidden"
     href="#"
     target="_blank"
     rel="noopener">
     מידע נוסף
  </a>
</main>

<script>

async function loadContent() {

  const params = new URLSearchParams(window.location.search);

  const id = (params.get("id") || "QR01").toUpperCase();

  const qrId = document.getElementById("qrId");
  const title = document.getElementById("title");
  const description = document.getElementById("description");
  const mainBtn = document.getElementById("mainBtn");
  const marketingBtn = document.getElementById("marketingBtn");

  qrId.textContent = id;

  try {

    const response = await fetch(
      "qr-data.json?time=" + new Date().getTime()
    );

    const items = await response.json();

    const item = items.find(
      x => x.id === id && x.active === true
    );

    if (!item) {

      title.textContent = "קוד QR לא נמצא";

      description.textContent =
        "לא נמצא תוכן פעיל עבור קוד זה.";

      return;
    }

    title.textContent = item.title || id;

    description.textContent =
      "לחצו על הכפתור לצפייה בתוכן.";

    if (item.url) {

      mainBtn.href = item.url;
      mainBtn.classList.remove("hidden");

    }

    if (
      item.showMarketing === true &&
      item.marketingUrl
    ) {

      marketingBtn.textContent =
        item.marketingText || "מידע נוסף";

      marketingBtn.href =
        item.marketingUrl;

      marketingBtn.classList.remove("hidden");

    }

  }
  catch(error) {

    title.textContent =
      "שגיאה בטעינת התוכן";

    description.textContent =
      "נסה שוב בעוד מספר שניות.";

  }

}

loadContent();

</script>

</body>
</html>
